name: Your Daily Outfit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Send daily brief
        run: uv run python -m src.automations.runner daily_outfit
